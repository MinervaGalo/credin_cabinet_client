
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Credit Details</title>
        <link rel="stylesheet" href="../styles.css">
    </head>

    <body class="popup-body">

        <div class="popup-header">
            <div>
                <p class="eyebrow">ДЕМО-ПРЕДЛОЖЕНИЕ</p>
                <h1>Условия кредита</h1>
                <p>Все ставки и суммы на странице вымышлены.</p>
            </div>

            <a class="popup-close" href="../credits.html">
                Закрыть
            </a>
        </div>

        <div class="card detail-panel">
            <div class="info-grid">
                <div class="info-item">
                    <small>Ставка</small>
                    <strong>от 13,2% годовых</strong>
                </div>
                <div class="info-item">
                    <small>Сумма</small>
                    <strong>до 15 000 000 ₽</strong>
                </div>
                <div class="info-item">
                    <small>Срок</small>
                    <strong>3–24 месяца</strong>
                </div>
                <div class="info-item">
                    <small>Цель</small>
                    <strong>Оборотные средства</strong>
                </div>
            </div>

            <p class="muted" style="font-size: 12px; line-height: 1.7">
                Предложение предназначено для демонстрации интерфейса
                и не является финансовой офертой.
            </p>
            <a class="button button-primary" href="new-application.html">
                Оформить заявку →
            </a>
        </div>

        <script src="popup.js" defer></script>
    </body>
</html>
