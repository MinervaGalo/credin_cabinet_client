<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Decision Counter Offer</title>
        <link rel="stylesheet" href="../styles.css">
    </head>

    <body class="popup-body">

        <div class="popup-header">
            <div>
                <p class="eyebrow">РЕШЕНИЕ БАНКА</p>

            <a class="popup-close" href="../bank-review.html">

            <a class="button button-primary" href="../bank.html">
                Вернуться к заявкам
            </a>

        <script src="popup.js" defer></script>
        <script src="../api.js" defer></script>
